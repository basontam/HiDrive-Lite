name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app.py sync_openlist_115.py scripts tests
      - name: Unit and API tests
        run: python -m pytest -m "not slow"
      - name: Secret and private-marker scan
        run: python scripts/scan_secrets.py --git-history
      - name: Whitespace check
        run: git diff --check
