[pytest]
testpaths = tests
# /tmp on the Claude container is a 16 MB tmpfs; keep pytest's temp dirs in the repo.
addopts = -p no:cacheprovider --basetemp=.pytest-tmp
filterwarnings =
    error::DeprecationWarning:app
markers =
    slow: performance smoke tests (15k synthetic media); deselect with -m "not slow"
